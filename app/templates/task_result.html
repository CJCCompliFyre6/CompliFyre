<!DOCTYPE html>
<html>

<head>
    <title>Activity Generation Status</title>
    <script src="https://cdn.tailwindcss.com"></title >
            <style>
                .loading-spinner {
                    border: 4px solid #f3f3f3;
                border-top: 4px solid #3498db;
                border-radius: 50%;
                width: 40px;
                height: 40px;
                animation: spin 2s linear infinite;
                margin: 20px auto;
        }
                @keyframes spin {
                    0 % { transform: rotate(0deg); }
            100% {transform: rotate(360deg); }
        }
            </style>
</head >
            <body class="bg-gray-100 min-h-screen flex items-center justify-center">
                <div class="bg-white p-8 rounded-lg shadow-md max-w-md w-full">
                    {% if status == 'started' %}
                    <div class="text-center">
                        <div class="loading-spinner"></div>
                        <h2 class="text-xl font-bold text-blue-600 mb-4">Activity Generation Started</h2>
                        <p class="text-gray-700 mb-2">Guideline ID: <strong>{{ guideline_id }}</strong></p>
                        <p class="text-gray-700 mb-2">Clauses to process: <strong>{{ clauses_to_process }}</strong></p>
                        <p class="text-gray-700 mb-4">Task ID: <code class="bg-gray-100 p-1 rounded">{{ task_id }}</code></p>
                        <p class="text-sm text-gray-500">This process may take several minutes. You can close this page.</p>
                    </div>

                    {% elif status == 'success' %}
                    <div class="text-center">
                        <div class="text-4xl mb-4">✅</div>
                        <h2 class="text-xl font-bold text-green-600 mb-4">Task Completed</h2>
                        <p class="text-gray-700 mb-4">{{ message }}</p>
                        <p class="text-sm text-gray-500">Guideline ID: {{ guideline_id }}</p>
                    </div>

                    {% elif status == 'error' %}
                    <div class="text-center">
                        <div class="text-4xl mb-4">❌</div>
                        <h2 class="text-xl font-bold text-red-600 mb-4">Error</h2>
                        <p class="text-gray-700 mb-4">{{ message }}</p>
                        <p class="text-sm text-gray-500">Guideline ID: {{ guideline_id }}</p>
                    </div>
                    {% endif %}

                    <div class="mt-6 text-center">
                        <a href="{{ url_for('re.get_clause') }}?guideline_id={{ guideline_id }}"
                            class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                            Back to Guidelines
                        </a>
                    </div>
                </div>
            </body>
</html >
