<!DOCTYPE html>
<html>
<head>
    <title>Debug Login</title>
</head>
<body>
    <h1>Debug Login Test</h1>
    
    <form id="debugForm">
        <div>
            <label>Email:</label>
            <input type="email" name="email" value="transforrm88@gmail.com" required>
        </div>
        <div>
            <label>Password:</label>
            <input type="password" name="password" value="iGL8GHLmvWU" required>
        </div>
        <button type="submit">Test Login</button>
    </form>
    
    <div id="result" style="margin-top: 20px; padding: 10px; border: 1px solid #ccc;"></div>
    
    <script>
        document.getElementById('debugForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const response = await fetch('/debug_login_attempt', {
                method: 'POST',
                body: formData
            });
            
            const result = await response.json();
            document.getElementById('result').innerHTML = '<pre>' + JSON.stringify(result, null, 2) + '</pre>';
        });
    </script>
</body>
</html>
