{% extends "audit_base.html" %}
{% block content %}  
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .step-active {
      border-color: #ea580c;
      color: #ea580c;
      font-weight: 600;
    }

    .hidden-step {
      display: none;
    }

    .input-box {
      width: 100%;
      padding: 0.6rem 1rem;
      border: 1px solid #ccc;
      border-radius: 1rem;
      background-color: white;
      outline: none;
    }

    .input-box:read-only {
      background-color: #f3f4f6;
      color: #6b7280;
      cursor: not-allowed;
    }

    @keyframes fadeInOut {

      0%,
      100% {
        opacity: 0;
        transform: scale(0.95);
      }

      10%,
      90% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .animate-fade-in-out {
      animation: fadeInOut 2s ease-in-out forwards;
    }
  </style>


<div class="bg-orange-100 min-h-screen flex flex-col relative">

  <!-- ✅ Success Popup  -->
  <div id="success-popup" class="hidden absolute top-20 left-1/2 transform -translate-x-1/2 z-50">
    <div
      class="bg-white/90 border border-green-400 text-green-600 px-8 py-6 rounded-xl shadow-2xl animate-fade-in-out flex flex-col items-center space-y-3">
      <!-- ✅ Icon container -->
      <div id="success-icon"
        class="bg-green-500 text-white rounded-full w-12 h-12 flex items-center justify-center text-2xl shadow">
        <i class="fas fa-check"></i>
      </div>
      <p id="popup-message" class="text-lg font-semibold">Profile updated successfully!</p>
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="flex-grow flex justify-center items-center px-4 py-10">
    <div class="bg-orange-200 rounded-3xl shadow-xl p-10 w-full max-w-5xl">

      <!-- Title -->
      <div class="mb-6">
        <h3 class="text-lg font-semibold">Edit Profile</h3>
      </div>

      <!-- Stepper Tabs -->
      <div class="flex justify-between mb-8 border-b border-gray-300 pb-4">
        <button onclick="showStep(0)" id="tab-personal" class="step-active border-b-4 px-4 py-2 rounded-t-lg">Personal
          Information</button>
        <button onclick="showStep(1)" id="tab-contact" class="border-b-4 px-4 py-2 rounded-t-lg">Contact
          Information</button>
        <button onclick="showStep(2)" id="tab-employment" class="border-b-4 px-4 py-2 rounded-t-lg">Employment
          Information</button>
      </div>

      <!-- FORM -->
      <form id="profile-form" method="POST" action="{{ url_for('main.edit_profile') }}" class="min-h-[300px]">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">


        <!-- Step 1: Personal Information -->
        <div id="step-personal" class="step-panel">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-medium mb-2">Full Name</label>
              <input type="text" name="name" class="input-box" value="{{ user.name if user.name else '' }}" required>
            </div>
            <div>
              <label class="block text-sm font-medium mb-2">Date of Birth</label>
              <input type="date" name="date_of_birth" class="input-box"
                value="{{ user.profile.date_of_birth.strftime('%Y-%m-%d') if user.profile and user.profile.date_of_birth else '' }}">
            </div>

            <div>
              <label class="block text-sm font-medium mb-2">Gender</label>
              <select name="gender" class="input-box">
                <option value="Female" {% if user.profile and user.profile.gender=='Female' %}selected{% endif %}>Female
                </option>
                <option value="Male" {% if user.profile and user.profile.gender=='Male' %}selected{% endif %}>Male
                </option>
                <option value="Other" {% if user.profile and user.profile.gender=='Other' %}selected{% endif %}>Other
                </option>
              </select>
            </div>

          </div>

          <!-- Buttons -->
          <div class="flex justify-between items-center pt-6">
            <!-- Cancel Button -->
            <button type="button" onclick="window.history.back()"
              class="border border-gray-400 bg-gray-400 text-black px-6 py-2 rounded-full hover:bg-gray-200 transition duration-200">
              Cancel
            </button>

            <!-- Next Button -->
            <button type="button" id="nextBtn"
              class="bg-orange-500 text-white px-6 py-2 rounded-full hover:bg-orange-600">
              Next
            </button>
          </div>
        </div>

        <!-- Step 2: Contact Information -->
        <div id="step-contact" class="step-panel hidden-step">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-medium mb-2">Phone Number</label>
              <div class="flex gap-2 items-center">
                <select name="phone_country_code" class="input-box w-[10px] px-2 text-sm">
                  <option value="+91" selected>+91 🇮🇳</option>
                  <option value="+1">+1 🇺🇸</option>
                  <option value="+44">+44 🇬🇧</option>
                  <option value="+61">+61 🇦🇺</option>
                  <option value="+81">+81 🇯🇵</option>
                  <option value="+971">+971 🇦🇪</option>
                </select>
                <input type="tel" name="phone_no" class="input-box w-[90px] px-2"
                  value="{{ user.phone_no if user.phone_no else '' }}" placeholder="Enter phone number" />
              </div>
            </div>
            <div>
              <label class="block text-sm font-medium mb-2">Email</label>
              <input type="email" name="email" class="input-box" value="{{ user.email if user.email else '' }}"
                placeholder="Enter email address" required>
            </div>
            <div class="md:col-span-2">
              <label class="block text-sm font-medium mb-2">Address</label>
              <textarea name="address" class="input-box" rows="3"
                placeholder="Enter your full address">{{ user.profile.address if user.profile and user.profile.address else '' }}</textarea>
            </div>
          </div>

          <div class="flex justify-between pt-9 mt-9">
            <button type="button" onclick="previousStep()"
              class="bg-orange-500 text-white px-6 py-2 rounded-full hover:bg-orange-600">
              Previous
            </button>
            <button type="button" id="nextBtn"
              class="bg-orange-500 text-white px-6 py-2 rounded-full hover:bg-orange-600">
              Next
            </button>
          </div>
        </div>

        <!-- Step 3: Employment Information -->
        <div id="step-employment" class="step-panel hidden-step">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-sm font-medium mb-2">Department</label>
              <input type="text" name="department" class="input-box"
                value="{{ user.profile.department if user.profile and user.profile.department else '' }}">
            </div>
            <div>
              <label class="block text-sm font-medium mb-2">Organization</label>
              <input type="text" name="organization_name" class="input-box"
                value="{{ user.profile.organization_name if user.profile and user.profile.organization_name else '' }}">
            </div>
            <div>
              <label class="block text-sm font-medium mb-2">Designation</label>
              <input type="text" name="designation" class="input-box"
                value="{{ user.profile.designation if user.profile and user.profile.designation else '' }}">
            </div>
            <div>
              <label class="block text-sm font-medium mb-2">Joining Date</label>
              <input type="date" name="joining_date" class="input-box"
                value="{{ user.profile.joining_date.strftime('%Y-%m-%d') if user.profile and user.profile.joining_date else '' }}">
            </div>
          </div>

          <div class="flex justify-between pt-9 mt-9">
            <button type="button" onclick="previousStep()"
              class="bg-orange-500 text-white px-6 py-2 rounded-full hover:bg-orange-600">
              Previous
            </button>
            <button type="submit" id="saveBtn"
              class="bg-green-500 text-white px-6 py-2 rounded-full hover:bg-green-600">
              Save Changes
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Script -->
  <script>
    const steps = ['personal', 'contact', 'employment'];
    let currentStep = 0;

    function showStep(index) {
      currentStep = index;
      steps.forEach((step, i) => {
        document.getElementById(`step-${step}`).classList.toggle('hidden-step', i !== index);
        document.getElementById(`tab-${step}`).classList.toggle('step-active', i === index);
      });
    }

    function previousStep() {
      if (currentStep > 0) {
        showStep(currentStep - 1);
      }
    }

    // Handle next buttons
    document.querySelectorAll('#nextBtn').forEach(btn => {
      btn.addEventListener('click', () => {
        if (currentStep < steps.length - 1) {
          showStep(currentStep + 1);
        }
      });
    });

    // Submit form and show success message
    document.getElementById("profile-form").addEventListener("submit", function (e) {
      // Don't prevent default - let the form submit normally
      showAlert("Saving changes...");
    });

    // Reusable alert function
    function showAlert(message) {
      const popup = document.getElementById("success-popup");
      const msg = document.getElementById("popup-message");
      const icon = document.getElementById("success-icon");

      msg.innerText = message;

      // Show icon only if message is success
      if (message.includes("successfully") || message.includes("Saving")) {
        icon.style.display = "flex";
      } else {
        icon.style.display = "none";
      }

      popup.classList.remove("hidden");
      setTimeout(() => {
        popup.classList.add("hidden");
        msg.innerText = "Profile updated successfully!"; // Reset
        icon.style.display = "flex"; // Reset for next time
      }, 2000);
    }

    // Initialize phone number parsing
    function initializePhoneNumber() {
      const phoneInput = document.querySelector('input[name="phone_no"]');
      const countrySelect = document.querySelector('select[name="phone_country_code"]');

      if (phoneInput && phoneInput.value && countrySelect) {
        const phoneValue = phoneInput.value;

        // Check which country code the phone starts with
        const countryCodes = ['+91', '+1', '+44', '+61', '+81', '+971'];
        for (let code of countryCodes) {
          if (phoneValue.startsWith(code)) {
            countrySelect.value = code;
            // Remove country code from phone input to avoid duplication
            phoneInput.value = phoneValue.substring(code.length);
            break;
          }
        }
      }
    }

    // Initialize
    showStep(currentStep);

    // Initialize phone number after page load
    document.addEventListener('DOMContentLoaded', function () {
      initializePhoneNumber();
    });
  </script>
</div>

{% endblock %}
