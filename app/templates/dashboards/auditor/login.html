<style>
    /* Global Reset */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
/* Body Styling */
body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background-color: #000;
  color: #fff;
}

/* Logo Styling */
.logo {
  width: 150px;
  height: auto;
  margin: 0 auto;
  display: block;
  max-width: 100%; /* Ensures logo scales properly */
}

/* Custom Card (Login Container) */
.custom-card {
  background-color: #1c1c1c;
  border-radius: 20px;
  box-shadow: 0 10px 6px rgba(0, 0, 0, 0.2);
  padding: 40px;
  text-align: left;
  width: 100%; 
  max-width: 350px; /* Prevents overflow on small screens */
}

/* Heading and Subheading */
.custom-card p.h4 {
  font-size: 24px;
  margin-bottom: 10px;
  font-weight: bold;
  text-align: center;
}

.custom-card p.text-muted {
  margin-bottom: 30px;
  text-align: center;
  font-size: 13px;
}

/* Form Controls */
.form-control {
  width: 100%;
  padding: 10px;
  margin: 15px 0;
  border: none;
  border-radius: 6px;
  background-color: #333;
  color: #fff;
  font-size: 16px;
  text-align: left;
}

.custom-card .form-label {
  margin-bottom: 10px;
}

.custom-card .form-control {
  margin-top: 10px;
}

/* Password Visibility Button */
.position-relative {
  width: 100%;
}

.show-password-button {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  cursor: pointer;
  color: #999;
}

.show-password-button:hover {
  color: #fff;
}

/* Continue Button */
.btn-primary {
  width: 100%;
  padding: 12px;
  background: linear-gradient(to right, #f76b1c, #ffa62b);
  border: none;
  border-radius: 25px;
  color: #fff;
  font-size: 20px;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 4px 10px rgba(255, 166, 43, 0.4);
  margin-top: 10px;
  text-decoration: none;
}

.btn-primary:hover {
  transform: scale(1.05);
  box-shadow: 0 6px 15px rgba(255, 166, 43, 0.6);
}

/* Grid Styling */
.d-grid {
  display: grid;
  place-items: center;
  margin-top: 10px;
  text-align: center;
}

/* ✅ Responsive Fixes */
@media (max-width: 576px) {
    .custom-card {
        padding: 20px;
    }

    .custom-card p.h4 {
        font-size: 20px;
    }

    .custom-card p.text-muted {
        font-size: 12px;
    }

    .form-control {
        font-size: 14px;
        padding: 8px;
    }

    .btn-primary {
        font-size: 18px;
        padding: 10px;
    }
}

</style>
</head>
