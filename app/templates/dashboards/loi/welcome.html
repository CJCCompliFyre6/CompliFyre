<!DOCTYPE html>
<html>
<head>
    <title>Welcome to CompliFyre</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <div class="bg-white rounded-lg shadow p-8 max-w-2xl">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">Welcome to CompliFyre, {{ org.name }}!</h1>
        <p class="text-gray-600 mb-4">Your account is ready. You have full access for the next 14 days to explore everything CompliFyre can do.</p>
        <p class="text-gray-500 text-sm mb-6">{{ preloaded_count }} guideline(s) are already sitting ready for you to explore in your library.</p>
        <a href="{{ url_for('audit.dashboard') }}" style="display:inline-block; background-color:#f76b1c; color:#ffffff; font-weight:bold; padding:10px 24px; border-radius:6px; text-decoration:none;">
            Continue to Dashboard &rarr;
        </a>
    </div>
</body>
</html>
