{% extends "audit_base.html" %}
{% block content %}

<!-- Include Toast UI Editor CSS and JS -->
<link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css" />
<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
<!-- Include SheetJS for Excel generation -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    body {
        font-family: 'Inter', sans-serif;
    }

    /* Custom styles for file input */
    .file-input-label {
        cursor: pointer;
        border: 2px dashed #fdba74;
        /* orange-300 */
        padding: 2rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-radius: 0.5rem;
        transition: background-color 0.2s, border-color 0.2s;
        background-color: #fff7ed;
        /* orange-50 */
    }

    .file-input-label:hover {
        background-color: #ffedd5;
        /* orange-100 */
        border-color: #fb923c;
        /* orange-400 */
    }

    .file-input:focus+.file-input-label {
        outline: 2px solid #f97316;
        /* orange-500 */
        outline-offset: 2px;
    }
</style>

<div class="w-auto mx-8 my-4 bg-orange-100 z-1 rounded-xl justify-between items-center min-h-[105vh]">
    <div class="flex flex-col items-center py-10 px-4 flex-grow">
        <div class="bg-orange-200 max-w-5xl w-full rounded-3xl shadow-lg p-6 md:p-10 relative space-y-12">

            <div class="mb-6">
                <a href="{{ url_for('re.get_clause', guideline_id=guideline_id) }}"
                    class="px-8 py-3 bg-orange-500 text-white font-semibold rounded-lg hover:bg-orange-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-orange-500 transition">
                    Back to List of Clauses
                </a>
            </div>

            <!-- Form 1: Add a Single Clause -->
            <form action="{{ url_for('main.add_clause', guideline_id=guideline_id) }}" method="POST"
                id="add-clause-form" class="form-step flex flex-col items-center">
                <h2 class="text-2xl font-semibold mb-6 text-orange-800">Add New Clause</h2>
                <div class="space-y-4 w-full max-w-xl">
                    <!-- This would be passed from the parent guideline page context -->
                    <input type="hidden" name="guideline_id" value="{{ guideline_id }}">

                    <div>
                        <label class="block mb-1 font-medium text-gray-700" for="add-clause-no">Clause Number
                            (Optional)</label>
                        <input type="text" id="add-clause-no" name="clause_no"
                            class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-orange-500 focus:border-orange-500"
                            placeholder="e.g., 4.1.2">
                    </div>

                    <div>
                        <label class="block mb-1 font-medium text-gray-700" for="clause_text">Clause Text</label>
                        <div id="editor" class="bg-white rounded-lg"></div>
                        <input type="hidden" id="clause_text" name="clause_text">
                    </div>
                </div>
                <div class="mt-8">
                    <button type="submit"
                        class="px-8 py-3 bg-orange-500 text-white font-semibold rounded-lg hover:bg-orange-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-orange-500 transition">
                        Save Clause
                    </button>
                </div>
            </form>

            <hr class="border-orange-300">

            <!-- Form 2: Bulk Upload Clauses -->
            <form action="{{ url_for('main.upload_clauses',guideline_id=guideline_id) }}" method="POST"
                enctype="multipart/form-data" id="upload-form" class="form-step flex flex-col items-center">
                <h2 class="text-2xl font-semibold mb-6 text-orange-800">Bulk Upload Clauses</h2>
                <div class="space-y-4 w-full max-w-xl">
                    <input type="hidden" name="guideline_id" value="{{ guideline_id }}">
                    <p class="text-center text-orange-700 mb-4">
                        Upload an Excel or CSV file with <strong>'clause_no'</strong> and <strong>'clause_text'</strong>
                        columns.
                    </p>

                    <!-- Download Sample Excel Button -->
                    <div class="text-center mb-4">
                        <button type="button" id="download-sample-excel"
                            class="inline-block px-5 py-2 bg-green-600 text-white font-semibold rounded-lg hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition">
                            Download Sample Excel
                        </button>
                    </div>

                    <div>
                        <input type="file" id="excel-file" name="excel_file" class="hidden file-input"
                            accept=".xlsx, .xls, .csv" required>
                        <label for="excel-file" class="file-input-label">
                            <svg class="w-12 h-12 text-orange-400 mb-2" xmlns="http://www.w3.org/2000/svg" fill="none"
                                viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round"
                                    d="M12 16.5V9.75m0 0l-3.75 3.75M12 9.75l3.75 3.75M3 17.25V6.75A2.25 2.25 0 015.25 4.5h13.5A2.25 2.25 0 0121 6.75v10.5A2.25 2.25 0 0118.75 19.5H5.25A2.25 2.25 0 013 17.25z" />
                            </svg>
                            <span class="font-semibold text-orange-800">Click to upload or drag & drop</span>
                            <span class="text-sm text-orange-600 mt-1">Excel, CSV (MAX. 5MB)</span>
                        </label>
                    </div>
                    <div id="file-name-display" class="text-sm text-orange-700 text-center font-medium h-5"></div>
                </div>
                <div class="mt-8">
                    <button type="submit"
                        class="px-8 py-3 bg-slate-700 text-white font-semibold rounded-lg hover:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-500 transition">
                        Upload and Process File
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Initialize Toast UI Editor for the add form
        const editor = new toastui.Editor({
            el: document.querySelector('#editor'),
            height: '250px',
            initialEditType: 'wysiwyg',
            previewStyle: 'vertical',
            initialValue: 'Enter the full text of the clause...'
        });

        // Set hidden input value on form submission
        document.querySelector("#add-clause-form").addEventListener("submit", function (event) {
            const markdown = editor.getMarkdown();
            if (!markdown || markdown.trim() === '' || markdown === 'Enter the full text of the clause...') {
                alert('Clause text cannot be empty.');
                event.preventDefault();
                return;
            }
            document.querySelector("#clause_text").value = markdown;
        });

        // Handle file input display
        const fileInput = document.getElementById('excel-file');
        const fileNameDisplay = document.getElementById('file-name-display');
        fileInput.addEventListener('change', function () {
            if (fileInput.files.length > 0) {
                fileNameDisplay.textContent = `Selected: ${fileInput.files[0].name}`;
            } else {
                fileNameDisplay.textContent = '';
            }
        });

        // Download Sample Excel
        document.getElementById("download-sample-excel").addEventListener("click", function () {
            const data = [
                ["clause_no", "clause_text"], // headers
                ["1.1", "The bank must maintain adequate capital adequacy ratio."],
                ["1.2", "The institution should implement robust risk management procedures."]
            ];
            const ws = XLSX.utils.aoa_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Clauses");
            XLSX.writeFile(wb, "bulk_upload_template.xlsx");
        });
    });
</script>
{%endblock%}
