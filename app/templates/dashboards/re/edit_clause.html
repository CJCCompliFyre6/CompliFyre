{% extends "audit_base.html" %}
{% block content %}
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
    <div class="w-auto mx-8 my-4 bg-orange-100 z-1 rounded-xl justify-between items-center min-h-[105vh]">
        <div class="flex flex-col items-center py-10 px-4 flex-grow">
            <div class="bg-orange-200 max-w-5xl w-full rounded-3xl shadow-lg p-6 md:p-10 relative">
                <form action="{{ url_for('main.edit_clause', clause_id=clause.id) }}" method="POST" id="edit-clause-form" class="form-step flex flex-col items-center">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <h2 class="text-2xl font-semibold mb-6 text-orange-800">Edit Clause</h2>
                    <div class="space-y-4 w-full max-w-3xl">
                        <div>
                            <label class="block mb-1 font-medium text-gray-700" for="edit-clause-no">Clause Number</label>
                            <input type="text" id="edit-clause-no" name="clause_no" required class="w-full p-3 border border-gray-300 rounded-lg shadow-sm focus:ring-2 focus:ring-orange-500 focus:border-orange-500" value="{{ clause.clause_no or '' }}">
                        </div>
                        <div>
                            <label class="block mb-1 font-medium text-gray-700" for="edit_clause_text">Clause Text</label>
                            <textarea id="edit_clause_text" name="clause_text" rows="14" required class="w-full p-3 border border-gray-300 rounded-lg shadow-sm bg-white leading-relaxed focus:ring-2 focus:ring-orange-500 focus:border-orange-500">{{ clause.clause_text or '' }}</textarea>
                        </div>
                    </div>
                    <div class="mt-8 flex gap-4">
                        <button type="button" onclick="window.history.back()" class="px-8 py-3 bg-slate-200 text-slate-700 font-semibold rounded-lg hover:bg-slate-300 transition">Cancel</button>
                        <button type="submit" class="px-8 py-3 bg-orange-500 text-white font-semibold rounded-lg hover:bg-orange-600 transition">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
