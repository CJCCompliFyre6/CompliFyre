services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    env_file:
      - ../.env
    volumes:
      - ./pdf_data:/app/instance
      - ./uploads:/app/uploads
      - ./cache:/app/cache
      - ../docker/entrypoint.sh:/usr/local/bin/entrypoint.sh
    ports:
      - "5000:5000"
    restart: unless-stopped
    mem_limit: 2g
    cpu_quota: 100000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: ["entrypoint.sh"]

  celery:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    env_file:
      - ../.env
    volumes:
      - ./pdf_data:/app/instance
      - ./uploads:/app/uploads
      - ./cache:/app/cache
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    command: ["celery", "-A", "celery_worker.celery", "worker", "--loglevel=info", "-Q", "extract_guidelines,extract_clauses,extract_activities,extract_test_procedures,extract_all_activities_and_tests,generate_consolidated_observation_summary,generate_consolidated_test_procedure,generate_consolidated_findings_summary,generate_consolidated_recommendations_summary,generate_missing_activities_for_guidelines,generate_single_clause_activities,extract_selected_activities_and_tests,consolidate_evidence_task", "-P", "eventlet"]

  redis:
    image: redis:6-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 1s
      timeout: 3s
      retries: 5
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]

  db:
    image: postgres:13-alpine
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compuser -d complifyre"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ../app/templates:/app/static
      - ./uploads:/app/uploads
      - ./cache:/app/cache
    depends_on:
      - backend

volumes:
  pdf_data:
  db_data:
