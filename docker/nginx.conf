server {
    listen 80;
    server_name 4.240.81.17; # Use your actual public IP or domain name

    # === FIX FOR 413 Request Entity Too Large ===
    # This sets the maximum allowed size of the client request body.
    # Increase this value as needed for large file uploads.
    # Example: 50M for 50 Megabytes. Use 1G for 1 Gigabyte if needed.
    client_max_body_size 50M; # Adjust this value!

    # Serve static files
    location /static/ {
        alias /app/static/;
        # Add caching headers for static files for better performance
        expires 30d; # Cache for 30 days
        add_header Cache-Control "public, no-transform";
    }

    # Serve uploaded files
    location /uploads/ {
        alias /app/uploads/;
        # Add caching headers for uploaded files
        expires 7d; # Cache for 7 days
        add_header Cache-Control "public, no-transform";
    }

    # Serve cached files (if needed, ensure this path is correct for your app)
    location /cache/ {
        alias /app/cache/;
        # Add caching headers for cached files
        expires 1d; # Cache for 1 day
        add_header Cache-Control "public, no-transform";
    }

    # Proxy API and app requests to Flask backend
    location / {
        # Ensure 'backend:80' is correct based on your Dockerfile/Gunicorn setup
        # If your Gunicorn/Flask app listens on 5000 inside the container, change this to http://backend:5000;
        proxy_pass http://backend:80;

        # Keep timeouts reasonable, 600s (10 minutes) is very long.
        # Only use 600 if you genuinely expect requests to take that long.
        # For most web apps, 30-60s is more common.
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;

        # These headers are good for WebSockets/Server-Sent Events and general proxying
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade'; # Use 'upgrade' if Upgrade header is present, otherwise 'close'
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # === RECOMMENDED STANDARD HEADERS FOR PROXYING ===
        # These help the backend app know the client's real IP, scheme, etc.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # For Nginx version 1.11.5+, you can use this for better proxy buffering
        # proxy_buffering off;
    }
}