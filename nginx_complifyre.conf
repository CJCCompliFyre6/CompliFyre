server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/complifyre.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/complifyre.in/privkey.pem;
    return 444;
}

server {
    server_name complifyre.in www.complifyre.in;
    client_max_body_size 300M;

    # --- S-12: HSTS ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # --- S-39: server hardening ---
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # --- S-75: Content Security Policy ---
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' cdn.jsdelivr.net cdnjs.cloudflare.com cdn.tailwindcss.com www.gstatic.com; style-src 'self' 'unsafe-inline' cdn.jsdelivr.net cdnjs.cloudflare.com fonts.googleapis.com unpkg.com; font-src 'self' fonts.gstatic.com cdnjs.cloudflare.com cdn.jsdelivr.net unpkg.com; img-src 'self' data: blob:; connect-src 'self' cdn.jsdelivr.net cdn.tailwindcss.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    # --- S-75: suppress Server header version + block OPTIONS method ---
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    # Restrict OPTIONS method
    if ($request_method = OPTIONS) {
        return 405;
    }

    # --- S-40: block backup/debug/config file exposure ---
    location ~* \.(env|bak|backup|old|swp|sql|log|ini|git)$ {
        deny all;
        return 404;
    }
    location ~* /(\.git|\.env|__pycache__|\.pytest_cache)/ {
        deny all;
        return 404;
    }
    location ~* /(guideline-extraction-progress|clause-extraction-progress|extraction-progress) {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
        keepalive_timeout 3600;
        chunked_transfer_encoding on;
    }
    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600;
        proxy_send_timeout 600;
        proxy_connect_timeout 600;
        # S-cache: prevent back-button vulnerability on authenticated pages
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/complifyre.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/complifyre.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.complifyre.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = complifyre.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name complifyre.in www.complifyre.in;
    listen 80;
    return 301 https://$host$request_uri; # was 404 -- see Change Log entry for S-14 rationale




}